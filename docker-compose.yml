services:
  # =========================================================
  # 🧠 Ollama (Local LLM engine)
  # =========================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama:/root/.ollama
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================
  # 💬 Open WebUI (Frontend)
  # =========================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui

    env_file:
      - .env

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}
      DATA_DIR: /app/data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OPENWEBUI_EMAIL: ${OPENWEBUI_EMAIL}
      OPENWEBUI_PASSWORD: ${OPENWEBUI_PASSWORD}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - open-webui:/app/backend/data
      - open-webui-data:/app/data

    depends_on:
      - postgres
      - ollama

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================================================
  # 🗄️ PostgreSQL
  # =========================================================
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    command: >
      postgres
      -c log_statement=none
      -c log_destination=stderr
      -c log_min_duration_statement=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # 🧩 pgAdmin
  # =========================================================
  pgadmin:
    image: dpage/pgadmin4:9.0
    container_name: pgadmin
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:5050"
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json
    entrypoint: >
      sh -c "
      cp /pgadmin4/servers.json /var/lib/pgadmin/servers.json &&
      chown -R 5050:5050 /var/lib/pgadmin &&
      chmod -R 700 /var/lib/pgadmin &&
      /entrypoint.sh
      "
    depends_on:
      - postgres
    restart: always

  # =========================================================
  # 📊 Monitoring — Prometheus
  # =========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================================================
  # 📈 Grafana
  # =========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    restart: unless-stopped

  # =========================================================
  # 🗂️ Loki – Logs
  # =========================================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped

  # =========================================================
  # 📡 Promtail – Docker log collector
  # =========================================================
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    depends_on:
      - loki
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yml
    restart: unless-stopped

  # =========================================================
  # 🧮 Node Exporter — System Metrics
  # =========================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped

  # =========================================================
  # 📊 cAdvisor — Container Metrics
  # =========================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # =========================================================
  # 📈 Postgres Exporter
  # =========================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}?sslmode=disable"
    depends_on:
      - postgres
    restart: unless-stopped

  # =========================================================
  # 🔄 Watchtower
  # =========================================================
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

volumes:
  ollama:
  open-webui:
  open-webui-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
  open-webui-frontend:
